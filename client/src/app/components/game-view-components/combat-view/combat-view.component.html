<div class="backdrop"></div>

<div class="combat-container">
    Combat en cours entre vous ({{self()?.name}}) et {{other()?.name}}

    <div class="combat-players">
        <app-player-combat-card [character]='self()!'></app-player-combat-card>
        
        <div class="vs-text">VS</div>
        <app-player-combat-card [character]='other()!'></app-player-combat-card>
    </div>

    <div class="combat-actions" [class.hidden]="hasChosen()">
        <button (click)="setPosture(combatPosture.DEFENSIVE)" class="button defensive brick-green">Défense</button>
        <button (click)="setPosture(combatPosture.OFFENSIVE)" class="button offensive brick-red">Attaque</button>
    </div>

    @if (hasChosen()) {
        <div class="combat-waiting">Choix envoyé, en attente du choix adverse...</div>
    }
    
</div>
