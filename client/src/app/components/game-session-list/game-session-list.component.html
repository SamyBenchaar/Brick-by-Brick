<div class="game-session-list">
    @if (availableGameSessions().length === 0) {
    <div class="no-sessions">
        <p>Aucune partie disponible</p>
    </div>
    } @else { @for (gameSession of availableGameSessions(); track gameSession.roomId) {
    <div class="game-session-item" [class.selected]="isSelected(gameSession.roomId)" (click)="selectGameSession(gameSession.roomId)">
        <div class="game-session-description">
            <p><strong>ID:</strong> {{ gameSession.roomId }}</p>
            <p><strong>Statut:</strong> {{ gameSession.status }}</p>
            <p>{{ gameSession.players.length }} / {{ gameSession.maxPlayers }} joueurs</p>
        </div>
    </div>
    } }
</div>
