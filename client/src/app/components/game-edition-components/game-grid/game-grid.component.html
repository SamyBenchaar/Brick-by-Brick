<div class="grid-container"
    (contextmenu)="onContextMenu($event)">
    @for (row of getGrid(); track $index; let y = $index) {
      <div class="grid-row">
        @for (tile of row; track $index; let x = $index) {
          <div class="tile" 
               [class]="'tile-' + tile.type"
               [style.backgroundImage]="'url(' + getTilePath(tile.type)+ ')'"
               (mousedown)="onTileMouseDown(x, y, $event)"
               (mouseenter)="onTileMouseEnter(x, y)">
               @if(tile.object) {
                <img [src] = "getObjectPath(tile.object)"
                     class="tile-object-image">
               }
          </div>
        }
      </div>
    }
  </div>
