<div class="container">
    <div class="header">
        <button class="button" style="background-image: url('./assets/images/red_large_brick.png');"
        (click)="leave()">←</button>
        <span class="header-title">Salle d'attente</span>
    </div>

    <div class="content">
        <section class="players">
            <h3 class="title brick-orange">Joueurs dans la partie</h3>
            <app-waiting-room-list></app-waiting-room-list>
        </section>

        <section class="chat">
            <h3 class="title brick-orange">Clavardage {{username}}</h3>
            <app-chat [username]="username" [gameId]="roomId" [hostPlayerId]="hostId" [isWriting]="isWriting"></app-chat>
        </section>
    </div>
</div>
