<div class="container">
  <h1 class="header-title">ADMINISTRER LES JEUX</h1>
  <div class="game-logo">game logo</div> <!--ajouter image logo -->

  <button class="add-button" >Ajouter un jeu</button> <!--ajouter linker -->

  <div class="games-list">
    @for (game of games; track game.id) {
    <div class="game-item">
      <div class="game-content">
        <div class="game-image">
          <img [src]="game.imageUrl" [alt]="game.nameImage">
        </div>
        <div class="game-info">
          <p class="game-name">{{ game.name }}</p>
          <div class="game-details">
            <span class="game-size">{{ game.size }}</span>
            <span class="game-mode">{{ game.mode }}</span>
            <span class="game-date">{{ game.date }}</span>
          </div>
        </div>
        <div class="game-actions">
          <button class="btn-icon btn-edit" 
                  title="Modifier">
            <span class="material-icons">edit</span>
          </button>
          <button class="btn-icon btn-delete" 
                  title="Supprimer">
            <span class="material-icons">delete</span>
          </button>
          <button class="btn-icon btn-visibility" 
                  title="Visibilite">
            <span class="material-icons">visibility</span>
          </button>
        </div>
      </div>
      <div class="game-description">
        {{ game.description }}
      </div>
    </div>
    }
  </div>
</div>
