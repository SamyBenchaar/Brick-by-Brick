<div class="container">
  <div class="header-row">
    <h1 class="header-title">ADMINISTRER LES JEUX</h1>
    <button class="add-button">Ajouter un jeu</button>
  </div>

  <div class="games-list">
    @for (game of games; track game._id) {
    <div class="game-item">
      <div class="game-content">
        <div class="game-image">
          <img [src]="game.previewImage" [alt]="game.name">
        </div>
        <div class="game-info">
          <p class="game-name">{{ game.name }}</p>
          <div class="game-details">
            <span class="game-size">{{ game.mapConfig.gridSize.height }}x{{ game.mapConfig.gridSize.width }}</span>
            <!-- <span class="game-mode">{{ game.mode }}</span> -->
            <span class="game-date">{{ game.lastModified | date:'medium' }}</span>
          </div>
        </div>
        <div class="game-actions">
            <button class="btn-icon btn-edit" 
                    title="Modifier">
                    <!-- TODO: aller vers vue d'edition -->
                <span class="material-icons">edit</span>
            </button>
            <button class="btn-icon btn-visibility" 
                    [title]="game.isVisible ? 'Masquer' : 'Afficher'"
                    (click)="editGame(game)">
                <span class="material-icons">{{ game.isVisible ? 'visibility' : 'visibility_off' }}</span>
            </button>
            <button class="btn-icon btn-delete" 
                    title="Supprimer"
                    (click)="deleteGame(game)">
                <span class="material-icons">delete</span>
            </button>
        </div>
      </div>
      <div class="game-description">
        {{ game.description }}
      </div>
    </div>
    }
  </div>
</div>
