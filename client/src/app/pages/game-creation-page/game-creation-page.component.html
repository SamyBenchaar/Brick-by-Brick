<div class="container">
    <div class="header">
        <span class="header-title">Création de partie</span>
        <button class="button return-button" [routerLink]="['/home']">Retour</button>
    </div>

    <div class="content">
        <section class="available-games">
            <h3 class="title">Jeux disponibles</h3>
            <app-game-list mode="creation" [showOnlyVisible]="true"> </app-game-list>
        </section>
    </div>
    <div class="footer">
        <button
            class="button"
            style="background-image: url('/assets/images/4x1_green.png')"
            [disabled]="!canCreateSession"
            (click)="createGameSession()"
        >
            Créer une partie
        </button>
    </div>
</div>
