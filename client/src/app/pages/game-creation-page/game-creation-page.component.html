<div class="game-creation">
    <div class="header">
        <span class="header-title">Création de partie</span>
        <button class="button" style="background-image: url('/assets/images/red_large_brick.png');"
        [routerLink]="['/home']">Quitter</button>
    </div>

    <div class="content">
        <section class="available-games">
            <h3 class="title">Jeux disponibles</h3>
            <div class="game-list">
            @for (game of games; track game._id) {
                <div class="game-item"
                    [class.selected]="game._id === selectedGameId"
                    (click)="selectGame(game._id)">
                    <div class="game-content">
                        <div class="game-image">
                        <img [src]="game.previewImage" [alt]="game.name">
                        </div>
                        <div class="game-info">
                            <span class="game-name">{{ game.name }}</span>
                            <span class="game-size">{{ game.mapConfig.size }}</span>
                            <span class="game-mode">{{game.gameMode}}</span>
                        </div>
                    </div>
                </div>
            }
            </div>
        </section>
    </div>
    <div class="footer">
        <button class="button" style="background-image: url('/assets/images/4x1_green.png');"
        [routerLink]="['/character-creation']">Créer une partie</button>
  </div>
</div>
