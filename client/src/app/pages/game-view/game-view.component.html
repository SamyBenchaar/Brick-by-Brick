<div class="container">
    <div class="header">
        <span class="header-title">Vue de jeu</span>
        <button 
            class="button" 
            style="background-image: url('/assets/images/red_large_brick.png');"
            [routerLink]="['/home']">
            retour
        </button>
    </div>

    <div class="content">
        @if (gameData) {     
                <div class="game-grid-container">
                    <app-game-grid [mapSize]="getMapSize()" [gameData]="gameData" [isViewMode]="true"> </app-game-grid>
                </div>
        }
    </div>
</div>
