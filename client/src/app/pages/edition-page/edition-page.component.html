<div class="edition-container pixel-font">
    <div class="sidebar-container">
        <app-tile-type-sidebar></app-tile-type-sidebar>
        <app-object-sidebar></app-object-sidebar>
    </div>
    <div class="edition-layout">
        
        <div class="game-info-container">
            
            <app-text-input
            class="name-input pixel-font"
            label="Nom de la partie"
            placeholder="Entrez le nom de la partie"
            [(value)]="gameName"
            [maxLength]="30"
            (valueChange)="this.getMapEditorService().setTitle($event)">
            </app-text-input>

            <app-text-input
            class="description-input pixel-font"
            label="Description"
            placeholder="Entrez une description"
            [(value)]="gameDescription"
            [maxLength]="60"
            (valueChange)="this.getMapEditorService().setDescription($event)">
            </app-text-input>

        </div>
        <app-game-grid [mapSize]="getMapSize()" [gameData]="this.getMapEditorService().getCurrentGame()"></app-game-grid>

        <div class="buttons">
            <button class="button" (click)="onSave()" style="background-image: url('/assets/images/4x1_green.png');">
            Enregistrer
            </button>

            <button class="button" (click)="onReset()" style="background-image: url('/assets/images/4x1_yellow.png');">
            Réinitialiser
            </button>

        </div>
    </div>
</div>
